<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News – Sozip Launcher</title>
    <meta name="description" content="Latest news and updates for Sozip Launcher">
    <link rel="icon" type="image/x-icon" href="images/logo.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gradient-1: #00f2fe;
            --gradient-2: #4facfe;
            --gradient-3: #a855f7;
            --gradient-4: #ec4899;
            --dark: #050510;
            --dark-card: rgba(255, 255, 255, 0.03);
            --dark-card-strong: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
            --shadow-1: 0 10px 30px rgba(0, 0, 0, 0.5);
            --shadow-2: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--dark);
            color: var(--text);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: linear-gradient(135deg, #050510 0%, #0a0a1a 100%);
        }

        .gradient-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: orb-float 20s ease-in-out infinite;
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2));
            top: -200px;
            left: -100px;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, var(--gradient-3), var(--gradient-4));
            bottom: -150px;
            right: -100px;
            animation-delay: -10s;
        }

        .orb-3 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            top: 40%;
            right: 20%;
            animation-delay: -5s;
        }

        @keyframes orb-float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(50px, -50px) scale(1.1); }
            50% { transform: translate(-30px, 30px) scale(0.95); }
            75% { transform: translate(-50px, -30px) scale(1.05); }
        }

        /* Grid Lines */
        .grid-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        /* Navbar */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1.2rem 2rem;
            background: rgba(5, 5, 16, 0.7);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-bottom: 1px solid var(--border);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        nav.scrolled {
            padding: 0.8rem 2rem;
            background: rgba(5, 5, 16, 0.9);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            text-decoration: none;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(79, 172, 254, 0.4);
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-text {
            background: linear-gradient(135deg, var(--gradient-1), var(--gradient-3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            position: relative;
            padding: 0.5rem 0;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--gradient-1), var(--gradient-3));
            transition: width 0.3s ease;
            border-radius: 2px;
        }

        .nav-links a:hover {
            color: var(--text);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.9rem 1.8rem;
            border-radius: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: none;
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2), var(--gradient-3));
            background-size: 200% 200%;
            color: white;
            box-shadow: 0 10px 40px rgba(79, 172, 254, 0.3);
            animation: gradient-shift 4s ease infinite;
        }

        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .btn-primary:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 60px rgba(79, 172, 254, 0.4);
        }

        .btn-secondary {
            background: var(--dark-card);
            color: white;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: var(--dark-card-strong);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        .mobile-menu-btn {
            display: none;
            background: var(--dark-card);
            border: 1px solid var(--border);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Content */
        .page-content {
            flex: 1;
            padding: 12rem 2rem 6rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeUp 0.8s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        .page-tag {
            display: inline-block;
            padding: 0.5rem 1.2rem;
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--gradient-2);
            margin-bottom: 1rem;
        }

        .page-header h1 {
            font-size: clamp(2.5rem, 5vw, 3.5rem);
            font-weight: 900;
            background: linear-gradient(90deg, var(--gradient-1), var(--gradient-2), var(--gradient-3), var(--gradient-4));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 6s ease infinite;
            margin-bottom: 1rem;
        }

        /* Update Card */
        .update-card {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.5rem;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
            animation: fadeUp 0.9s ease;
        }

        .update-card:hover {
            border-color: rgba(79, 172, 254, 0.3);
            background: var(--dark-card-strong);
            transform: translateY(-5px);
            box-shadow: var(--shadow-2);
        }

        .version-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: linear-gradient(135deg, var(--gradient-1), var(--gradient-3));
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }

        .changelog-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text);
        }

        .changelog-text {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        /* Footer */
        footer {
            background: var(--dark-card);
            border-top: 1px solid var(--border);
            padding: 3rem 2rem 2rem;
            text-align: center;
            color: var(--text-muted);
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 2rem;
        }

        .footer-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Mobile */
        @media (max-width: 968px) {
            .nav-links, .nav-buttons {
                display: none;
            }

            .mobile-menu-btn {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="animated-bg"></div>
    <div class="gradient-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="grid-lines"></div>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <img src="images/logo.png" alt="Sozip Launcher Logo">
                </div>
                <span class="logo-text">Sozip Launcher</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html#features">Features</a></li>
                <li><a href="index.html#screenshots">Screenshots</a></li>
                <li><a href="download.html">Download</a></li>
                <li><a href="news.html">News</a></li>
            </ul>
            <div class="nav-buttons">
                <a href="upload.html" class="btn btn-secondary">Ely.by Skins</a>
                <a href="download.html" class="btn btn-primary">
                    <span>Download Now</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </a>
            </div>
            <button class="mobile-menu-btn">☰</button>
        </div>
    </nav>

    <div class="page-content">
        <div class="container">
            <div class="page-header">
                <div class="page-tag">📰 Latest Update</div>
                <h1>What's New</h1>
            </div>

            <div class="update-card" id="update-card">
                <div class="version-badge" id="version-badge">Loading...</div>
                <h2 class="changelog-title">Changelog</h2>
                <p class="changelog-text" id="changelog-text">Fetching latest update...</p>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-brand">
                <div class="logo-icon">
                    <img src="images/logo.png" alt="Sozip Launcher Logo">
                </div>
                <span class="logo-text">Sozip Launcher</span>
            </div>
            <p>&copy; 2026 Sozip Launcher — Not affiliated with Mojang.</p>
        </div>
    </footer>

    <script>
        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            const nav = document.querySelector('nav');
            if (window.scrollY > 50) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        });

        // Fetch update data
        async function fetchUpdate() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/sozipp/LAUNCHER-UPDATER/main/UPDATE.json?cb=' + Date.now() + '&_t=' + Math.random(), {
                    cache: 'no-store',
                    headers: {
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache'
                    }
                });
                const data = await response.json();

                // Update the UI
                document.getElementById('version-badge').textContent = `v${data.latest_version}`;
                document.getElementById('changelog-text').textContent = data.changelog;

                // Remove download links section
                const downloadLinksDiv = document.getElementById('download-links');
                downloadLinksDiv.innerHTML = '';
            } catch (error) {
                console.error('Error fetching update:', error);
                document.getElementById('version-badge').textContent = 'Error';
                document.getElementById('changelog-text').textContent = 'Failed to fetch latest update. Please check back later!';
            }
        }

        fetchUpdate();
    </script>
</body>
</html>
